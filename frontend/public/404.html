<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — IMCEO DEV</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23123fb3'/><text x='16' y='21' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='13' fill='%23ffffff' text-anchor='middle'>IM</text></svg>"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #eff6ff;
      color: #123fb3;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: #090d16;
    }
    p {
      font-size: 0.925rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #123fb3;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1552db;
    }
    .redirect-note {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 1.25rem;
    }
  </style>
  <script>
    var seconds = 3;
    var interval = setInterval(function() {
      seconds--;
      var el = document.getElementById('countdown');
      if (el) el.innerText = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">IMCEO DEV STUDIO</div>
    <h1>Page Not Found</h1>
    <p>The requested page or resource could not be found. You will be automatically redirected to the homepage.</p>
    <a href="/" class="btn">Return to Homepage</a>
    <div class="redirect-note">Redirecting in <span id="countdown">3</span> seconds...</div>
  </div>
</body>
</html>
